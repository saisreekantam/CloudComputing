name: notetaker

x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  AMQP_URL: amqp://notetaker:notetaker@rabbitmq:5672/
  RABBITMQ_MGMT_URL: http://notetaker:notetaker@rabbitmq:15672

services:
  rabbitmq:
    image: rabbitmq:4.0-management
    hostname: rabbitmq            # fixed node name so durable data survives container re-creation
    environment:
      RABBITMQ_DEFAULT_USER: notetaker
      RABBITMQ_DEFAULT_PASS: notetaker
    ports:
      - "5672:5672"
      - "15672:15672"             # management UI (notetaker / notetaker)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ./backend
      target: gateway
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2                 # scale with: docker compose up -d --scale worker=N
    stop_grace_period: 40s
    restart: "no"                 # a killed worker stays dead so crash recovery is visible

volumes:
  rabbitmq-data:
  redis-data:
