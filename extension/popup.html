<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Notes Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22" />
      <span>Video Notes</span>
    </div>
    <div class="top-actions">
      <button id="conn" class="pill" type="button" title="Notion connection"></button>
      <button id="opts" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <section id="current" class="current" hidden></section>

  <main id="jobs" class="jobs" aria-live="polite"></main>

  <footer class="foot">
    <span id="server" class="server"><i></i><span>Checking server…</span></span>
    <button id="clear" class="link" type="button" hidden>Clear finished</button>
  </footer>

  <template id="job-tpl">
    <article class="job">
      <div class="job-head">
        <img class="thumb" alt="" />
        <div class="job-meta">
          <div class="job-title"></div>
          <div class="job-sub"></div>
        </div>
        <button class="dismiss icon-btn" type="button" title="Remove from list" aria-label="Remove">✕</button>
      </div>
      <ol class="stepper"></ol>
      <div class="bar"><span></span></div>
      <div class="status-line"></div>
      <div class="notice wait" hidden></div>
      <div class="notice recover" hidden></div>
      <div class="notice warn" hidden></div>
      <div class="notice err" hidden></div>
      <div class="actions"></div>
    </article>
  </template>
  <script type="module" src="popup.js"></script>
</body>
</html>
